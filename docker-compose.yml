# Nexa - everything in Docker, light by default (about 5 GB of memory in use, every service capped).
#
#   docker compose up -d --build                # web :3000, API :8000, LiveKit :7880, local LLM, speech, voices
#   docker compose --profile worker up -d       # + background worker (only needed at scale; jobs run in the API)
#   docker compose --profile gpu up -d          # + vLLM (NVIDIA GPU); set LLM_BASE_URL=http://llm-gpu:8000/v1
#   docker compose --profile neural up -d       # + natural voices with cloning (NVIDIA GPU)
#   docker compose --profile sip up -d          # + LiveKit SIP for real phone numbers
#   docker compose --profile monitoring up -d   # + Prometheus & Grafana
#
# On a Mac, Docker can't use the GPU, so models run on the CPU. Speech recognition is the slow part; run it natively
# on the Apple GPU instead (same accuracy, several times faster):
#   scripts/stt-mac.sh   and in .env:  STT_BASE_URL=http://host.docker.internal:8011/v1   (then: docker compose stop stt)
# The LLM likewise: `ollama serve` + `ollama pull qwen2.5:3b`, and LLM_BASE_URL=http://host.docker.internal:11434/v1
# Natural/cloned voices run on the Mac itself (Apple GPU), not in Docker: scripts/start-mac.sh starts both.
#
# Copy .env.example to .env first (optional).

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexa}:${POSTGRES_PASSWORD:-nexa}@postgres:5432/${POSTGRES_DB:-nexa}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Wm9vX2RldmVsb3BtZW50X2tleV9kb19ub3RfdXNlXzE=}
  CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:3000}"]'
  LOCAL_AI: ${LOCAL_AI:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  LLM_API_KEY: ${LLM_API_KEY:-not-needed}
  STT_PROVIDER: ${STT_PROVIDER:-whisper}
  STT_BASE_URL: ${STT_BASE_URL:-http://stt:8001/v1}
  TTS_PROVIDER: ${TTS_PROVIDER:-piper}
  TTS_BASE_URL: ${TTS_BASE_URL:-http://tts:8002}
  # Natural/cloned voices run outside Docker on the Mac (scripts/voice-mac.sh, Apple GPU). With the NVIDIA `neural`
  # profile instead: NEURAL_TTS_BASE_URL=http://tts-neural:8002
  NEURAL_TTS_BASE_URL: ${NEURAL_TTS_BASE_URL:-http://host.docker.internal:8004}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
  ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
  AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
  AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-uaenorth}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings:8003/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  SIP_PROVIDER: ${SIP_PROVIDER:-livekit}
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_API_URL: http://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_devsecret_devsecret_devsecret}
  DEMO_CLINIC_DATABASE_URL: postgresql://clinic_agent:${CLINIC_DB_PASSWORD:-clinic_agent}@postgres:5432/clinic_demo
  JOBS_INLINE: ${JOBS_INLINE:-true}            # documents are processed in the API (no worker needed)
  RECORDINGS_DIR: /data/recordings              # call recordings (agent setting: Privacy -> record calls)
  ALLOW_PRIVATE_NETWORK_INTEGRATIONS: ${ALLOW_PRIVATE_NETWORK_INTEGRATIONS:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa}
      POSTGRES_DB: ${POSTGRES_DB:-nexa}
      CLINIC_DB_PASSWORD: ${CLINIC_DB_PASSWORD:-clinic_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./infrastructure/postgres/init/02-clinic-demo.sh:/docker-entrypoint-initdb.d/02-clinic-demo.sh:ro
      - ./infrastructure/postgres/clinic_demo.sql:/docker-entrypoint-initdb.d/clinic_demo.sql.in:ro
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexa}"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--save", ""]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    mem_limit: 64m
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment: *api-env
    ports: ["${API_PORT:-8000}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach an LLM / voice service running natively
    volumes: [recordings:/data/recordings]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ["python", "-m", "nexa_worker.main"]
    environment: *api-env
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        # Leave empty to proxy through the web app (/api). Set only to call the API directly from browsers.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    mem_limit: 384m
    restart: unless-stopped

  stt:
    build: { context: services/stt }
    environment:
      # large-v3-turbo: 13.4% word errors on our Arabic call tests and exact on a real recorded voice, ~2.1 GB.
      # small saves ~1.4 GB but mishears Arabic noticeably more (17.8%): WHISPER_MODEL=small STT_MEMORY=2g.
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}   # as accurate as beam search on call audio, and faster
    volumes: [models:/models]
    ports: ["8001:8001"]
    mem_limit: ${STT_MEMORY:-3g}
    restart: unless-stopped

  tts:
    build: { context: services/tts }
    environment:
      PIPER_VOICES: ${PIPER_VOICES:-ar_JO-kareem-medium,en_US-amy-medium}
    volumes: [models:/models]
    ports: ["8002:8002"]
    mem_limit: 768m
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13  # v1.9 drops browser calls with current LiveKit SDKs
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on: [redis]
    mem_limit: 256m
    restart: unless-stopped

  voice-runtime:
    build: { context: ., dockerfile: infrastructure/docker/voice.Dockerfile }
    environment:
      <<: *api-env
      VOICE_LIGHT: "1"                          # calls run as threads in one process (not a process per call)
      VOICE_MAX_CALLS: ${VOICE_MAX_CALLS:-4}   # capacity in calls, not CPU load (a busy CPU must not refuse calls)
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [recordings:/data/recordings]
    depends_on: [livekit, api, stt, tts]
    mem_limit: 1g
    restart: unless-stopped

  # Local LLM: llama.cpp's server (small CPU image) with Qwen2.5 3B. It got all of our Arabic call checks right
  # (booking tool call, answers from clinic information, intents); the model (~2 GB) downloads on first start.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf ${LLM_HF_MODEL:-Qwen/Qwen2.5-3B-Instruct-GGUF:q4_k_m}
      --alias ${LLM_MODEL:-qwen2.5:3b} --jinja -c 4096 -np 1 --host 0.0.0.0 --port 8080
    environment:
      LLAMA_CACHE: /models
    volumes: [llm-models:/models]
    ports: ["8010:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      retries: 60
      start_period: 30s
    mem_limit: ${LLM_MEMORY:-3g}
    restart: unless-stopped

  # ---- optional profiles --------------------------------------------------------------------

  llm-gpu:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-8B}
      --served-model-name ${VLLM_MODEL:-Qwen/Qwen3-8B}
      --enable-auto-tool-choice --tool-call-parser hermes
      --max-model-len ${LLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${LLM_GPU_MEMORY_UTILIZATION:-0.9}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes: [hf-cache:/root/.cache/huggingface]
    ports: ["8010:8000"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  tts-neural:
    profiles: ["neural"]
    build:
      context: services/tts
      args:
        NEURAL: "true"
        BASE: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    environment:
      TTS_ENGINES: neural
      NEURAL_DEVICE: cuda
      NEURAL_PRELOAD: "false"        # loads when a natural/cloned voice is used,
      NEURAL_IDLE_MINUTES: "10"      # and frees its memory after 10 idle minutes
    volumes: [models:/models]
    ports: ["8004:8002"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  livekit-sip:
    profiles: ["sip"]
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecret_devsecret_devsecret_devsecret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    depends_on: [livekit, redis]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]

volumes:
  pgdata:
  models:
  hf-cache:
  llm-models:
  recordings:
